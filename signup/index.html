<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request a mailbox · Babu Satsang Society</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gotu&family=Noto+Serif+Telugu:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1208;
        --leaf: #1f3d2a;
        --leaf-deep: #13261a;
        --gold: #c4a35a;
        --gold-soft: #e8d5a3;
        --paper: #f3e6c8;
        --ember: #9a3412;
        --muted: #6b5a3e;
        --shadow: 0 14px 40px rgba(19, 38, 26, 0.28);
        --font-te: "Noto Serif Telugu", "Source Serif 4", "Gotu", serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        color: var(--ink);
        font-family: var(--font-te);
        background: linear-gradient(160deg, #214532, #163124 45%, #0f1f16);
        background-attachment: fixed;
      }
      .shell {
        width: min(720px, calc(100% - 1.5rem));
        margin: 0 auto;
        padding: 1.25rem 0 2.5rem;
      }
      .brand {
        display: inline-block;
        margin: 0 0 0.75rem;
        color: var(--gold-soft);
        font-size: clamp(1.4rem, 5vw, 2rem);
        line-height: 1.1;
        text-decoration: none;
      }
      .brand:hover,
      .brand:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }
      h1 {
        margin: 0 0 0.35rem;
        color: var(--gold-soft);
        font-size: clamp(1.7rem, 6vw, 2.4rem);
        font-weight: 600;
        line-height: 1.2;
      }
      .subtitle {
        margin: 0 0 1rem;
        color: #e8d5a3bf;
        font-size: 1rem;
        line-height: 1.45;
      }
      form {
        display: grid;
        gap: 0.85rem;
        border-radius: 12px;
        padding: 1rem;
        background: var(--paper);
        box-shadow: var(--shadow);
      }
      label {
        display: grid;
        gap: 0.35rem;
        color: var(--leaf-deep);
        font-size: 1rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        min-width: 0;
        border: 0;
        border-radius: 12px;
        padding: 0.9rem 1rem;
        font: inherit;
        font-size: 1.1rem;
        background: #fffdf8;
        color: var(--ink);
      }
      input:focus-visible {
        outline: 2px solid var(--gold);
      }
      .addr {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.15rem 0.35rem;
        border-radius: 12px;
        padding: 0.35rem 0.85rem 0.35rem 0.35rem;
        background: #fffdf8;
      }
      .addr:focus-within {
        outline: 2px solid var(--gold);
      }
      .addr input {
        flex: 1 1 8rem;
        width: auto;
        border-radius: 10px;
        padding: 0.55rem 0.65rem;
        background: transparent;
      }
      .addr input:focus-visible {
        outline: none;
      }
      .domain {
        color: var(--muted);
        font-size: 1.05rem;
        font-weight: 600;
        line-height: 1.3;
      }
      .preview {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 400;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .preview strong {
        color: var(--leaf-deep);
        font-weight: 700;
      }
      .preview.empty strong {
        color: var(--muted);
        font-weight: 600;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 0.9rem 1rem;
        font: inherit;
        font-size: 1.05rem;
        cursor: pointer;
        background: var(--leaf);
        color: var(--gold-soft);
      }
      button:hover,
      button:focus-visible {
        outline: 2px solid var(--gold);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .note {
        margin: 0.85rem 0 0;
        color: #e8d5a3bf;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .error {
        margin: 0;
        color: var(--ember);
        font-size: 0.92rem;
        font-weight: 600;
      }
      @media (max-width: 520px) {
        .shell {
          width: calc(100% - 1rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <a class="brand" href="/babusatsangsociety/">Babu Satsang Society</a>
      <h1>Request a mailbox</h1>
      <p class="subtitle">Ask for an address on babusatsangsociety.org.</p>
      <form id="signup">
        <label>
          Your name
          <input
            id="person"
            name="person"
            type="text"
            autocomplete="name"
            maxlength="80"
            required
            placeholder="Your name"
          />
        </label>
        <label>
          Mailbox
          <span class="addr">
            <input
              id="local"
              name="local"
              type="text"
              inputmode="email"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              maxlength="64"
              required
              placeholder="name"
              aria-describedby="preview"
            />
            <span class="domain">@babusatsangsociety.org</span>
          </span>
        </label>
        <p id="preview" class="preview empty" aria-live="polite">
          Your address: <strong id="full">name@babusatsangsociety.org</strong>
        </p>
        <p id="error" class="error" hidden></p>
        <button id="send" type="submit">Send request</button>
      </form>
      <p class="note">Someone will create the mailbox after this request.</p>
    </main>
    <script>
      (function () {
        var DOMAIN = "babusatsangsociety.org";
        var TO = "babusatsangsociety@zohomail.com";
        var person = document.getElementById("person");
        var local = document.getElementById("local");
        var full = document.getElementById("full");
        var preview = document.getElementById("preview");
        var error = document.getElementById("error");
        var form = document.getElementById("signup");

        function mailboxLocal(value) {
          return String(value || "")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "")
            .replace(/[^a-z0-9._-]/g, "")
            .replace(/\.{2,}/g, ".")
            .replace(/^[-.]+|[-.]+$/g, "")
            .slice(0, 64);
        }

        function address() {
          var box = mailboxLocal(local.value);
          return box ? box + "@" + DOMAIN : "";
        }

        function paint() {
          var addr = address();
          if (addr) {
            full.textContent = addr;
            preview.classList.remove("empty");
          } else {
            full.textContent = "name@" + DOMAIN;
            preview.classList.add("empty");
          }
        }

        local.addEventListener("input", paint);
        person.addEventListener("input", function () {
          error.hidden = true;
        });
        local.addEventListener("input", function () {
          error.hidden = true;
        });

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var name = person.value.trim();
          var addr = address();
          if (!name || !addr) {
            error.hidden = false;
            error.textContent = "Enter your name and the mailbox you want.";
            return;
          }
          var subject = "Mailbox request: " + addr;
          var body =
            "Name: " +
            name +
            "\nRequested mailbox: " +
            addr +
            "\n\nPlease create this mailbox.";
          window.location.href =
            "mailto:" +
            TO +
            "?subject=" +
            encodeURIComponent(subject) +
            "&body=" +
            encodeURIComponent(body);
        });

        paint();
      })();
    </script>
  </body>
</html>
