<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · Babu Satsang Society</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #163124;
        color: #1a1208;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 2rem;
      }
      h1,
      a {
        color: #e8d5a3;
      }
      form {
        display: grid;
        gap: 0.75rem;
        padding: 1rem;
        background: #f3e6c8;
        border-radius: 8px;
      }
      label {
        display: grid;
        gap: 0.25rem;
        font-weight: 600;
      }
      input,
      textarea,
      button {
        font: inherit;
        padding: 0.6rem 0.7rem;
        border-radius: 6px;
        border: 0;
      }
      button {
        background: #1f3d2a;
        color: #e8d5a3;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign up</h1>
      <form action="https://formsubmit.co/babusatsangsociety@zohomail.com" method="POST">
        <input type="hidden" name="_subject" value="Signup" />
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="_captcha" value="false" />
        <input
          type="hidden"
          name="_next"
          value="https://gayathrimatha.github.io/babusatsangsociety/signup/thanks.html"
        />
        <label>
          First name
          <input name="First name" type="text" autocomplete="given-name" required />
        </label>
        <label>
          Last name
          <input name="Last name" type="text" autocomplete="family-name" required />
        </label>
        <label>
          Gotram
          <input name="Gotram" type="text" required />
        </label>
        <label>
          Address
          <textarea name="Address" rows="3" autocomplete="street-address" required></textarea>
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <button type="submit">Send to Zoho Mail</button>
      </form>
    </main>
  </body>
</html>
